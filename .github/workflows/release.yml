name: Release

# A push to master is a release.
#
# The version is computed from the commits since the last tag, not read from a
# file. That is the opposite of aurora-core, and deliberately so: aurora-core
# publishes a package other projects install, and its release notes have to
# carry the "Dans aurora-client" section that a human writes by hand, so the
# number lives in CHANGELOG.md where it gets reviewed. This project publishes
# deployable states of itself. Nobody requires it, there is no migration
# paragraph to carry, and a changelog here would be a file to remember - the
# day somebody forgets, releases stop silently.
#
# The bump comes from Conventional Commits, which this repository already
# enforces: a breaking marker bumps major, a `feat` bumps minor, anything else
# bumps patch.

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail

          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$last" ]; then
            range=""
            next="0.1.0"
          else
            range="${last}..HEAD"
            if [ -z "$(git log --oneline $range)" ]; then
              echo "::notice::No commit since ${last} - nothing to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            log=$(git log --format='%s%n%b' $range)
            major=${last#v}; major=${major%%.*}
            rest=${last#v}; rest=${rest#*.}
            minor=${rest%%.*}
            patch=${rest#*.}

            # `type!: subject` or a `BREAKING CHANGE:` line, per Conventional
            # Commits. Checked first: a breaking change outranks everything.
            if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$log" || grep -q 'BREAKING CHANGE' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi

            next="${major}.${minor}.${patch}"
          fi

          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create the tag and the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RANGE: ${{ steps.version.outputs.range }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Subjects only: the bodies in this repository are long by convention,
          # and a release note that reprints them is one nobody reads.
          if [ -n "$RANGE" ]; then
            git log --no-merges --format='- %s' "$RANGE" > release-notes.md
          else
            git log --no-merges --format='- %s' > release-notes.md
          fi

          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --target master
