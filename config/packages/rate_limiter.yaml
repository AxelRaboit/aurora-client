framework:
    rate_limiter:
        form_submission:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # Les deux chemins d'écriture qu'un inconnu tenant un lien de contrat
        # peut atteindre. Le contrôleur public d'aurora-core les câble par nom :
        # sans ces deux entrées, le conteneur ne se construit pas.
        #
        # Les deux sont calées sur l'IP, qui est à l'attaquant de faire tourner.
        # C'est donc le mur extérieur, pas le seul : le code porte sa propre
        # limite de tentatives et son plafond par lien.
        contract_signature:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        contract_signature_code:
            policy: sliding_window
            limit: 15
            interval: '1 hour'

        # Le mot de passe d'un lien de partage de présentation, câblé par nom
        # par le contrôleur public d'aurora-core depuis la 0.9.166 : sans cette
        # entrée, le conteneur ne se construit pas.
        #
        # Calée sur l'IP comme les deux précédentes, avec la même réserve. Le
        # mur intérieur, ici, est qu'un mot de passe faux répond exactement ce
        # que répond une adresse fausse.
        deck_share_password:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # L'écriture qu'un client tenant un lien d'espace peut atteindre. Le
        # contrôleur public d'aurora-core la câble par nom : sans cette entrée,
        # le conteneur ne se construit pas.
        #
        # Calée sur l'IP, donc mur extérieur comme les précédentes. Le mur
        # intérieur est que le lien porte ses propres droits, et qu'un lien
        # révoqué ou expiré ne mène nulle part.
        space_guest_write:
            policy: sliding_window
            limit: 40
            interval: '1 hour'

        # Le dépôt de fichier d'un client tenant un lien d'espace. Le
        # contrôleur public d'aurora-core le câble par nom : sans cette
        # entrée, le conteneur ne se construit pas.
        #
        # Séparé de `space_guest_write` parce qu'un fichier ne coûte pas ce
        # que coûte un avis.
        space_guest_upload:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
