# The module's own catalogue, co-located with it — aurora discovers
# src/Module/<X>/translations/ for client modules as it does for its own.
#
# The toggle and nav keys are read by the core (sidemenu, module-access
# modal), hence the `backend.nav.*` and `backend.modules.*` prefixes: the
# core renders them, the module only supplies them.
backend:
  nav:
    tracking_dashboard: Tracking
  modules:
    tracking: Tracking
    tracking_description: Project-specific tracking screen — example of a self-contained client module.
  tracking:
    title: Tracking
    subtitle: A self-contained client module, added without changing anything in aurora-core.
    placeholder: This screen exists only to demonstrate the full wiring of a client module — module, context, controller, view, translations and toggle.
